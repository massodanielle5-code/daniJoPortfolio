<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- ================================
         SEO PRINCIPAL
    ================================= -->

    <title>
      Danielle Masso | Développeuse logiciel & Transformation digitale
    </title>

    <meta
      name="description"
      content="Portfolio de Danielle Masso, développeuse logiciel et consultante en transformation digitale. Je conçois des applications web modernes, performantes et adaptées aux besoins réels des organisations."
    />

    <meta
      name="keywords"
      content="Danielle Masso, développeuse logiciel, développeuse full stack, développement web, transformation digitale, React, Node.js, JavaScript, PostgreSQL, applications web, Cameroun"
    />

    <meta name="author" content="Danielle Masso" />

    <meta name="robots" content="index, follow" />

    <!-- ================================
         CANONICAL
    ================================= -->

    <!--
      À ajouter lorsque le nom de domaine définitif sera acheté.
      Exemple :
      <link rel="canonical" href="https://ton-domaine.com/" />
    -->


    <!-- ================================
         OPEN GRAPH
    ================================= -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:locale"
      content="fr_FR"
    />

    <meta
      property="og:title"
      content="Danielle Masso | Développeuse logiciel & Transformation digitale"
    />

    <meta
      property="og:description"
      content="Je conçois des applications web modernes, performantes et pensées pour répondre à des besoins réels."
    />

    <meta
      property="og:image"
      content="/og-image.png"
    />

    <meta
      property="og:image:alt"
      content="Danielle Masso — Développeuse logiciel et transformation digitale"
    />

    <!--
      L'URL définitive sera ajoutée lorsque ton domaine sera acheté :
      
      <meta
        property="og:url"
        content="https://ton-domaine.com/"
      />
    -->


    <!-- ================================
         TWITTER / X CARD
    ================================= -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Danielle Masso | Développeuse logiciel & Transformation digitale"
    />

    <meta
      name="twitter:description"
      content="Je conçois des applications web modernes, performantes et pensées pour répondre à des besoins réels."
    />

    <meta
      name="twitter:image"
      content="/og-image.png"
    />

    <meta
      name="twitter:image:alt"
      content="Danielle Masso — Développeuse logiciel et transformation digitale"
    />


    <!-- ================================
         FAVICON
    ================================= -->

    <link
      rel="icon"
      type="image/jpeg"
      href="/logo.jpeg"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
